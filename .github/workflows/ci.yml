# Typecheck, unit tests, the built Cloud Function code in dist/ being up to date,
# and the Firestore emulator tests (rules + the job writing real documents).
name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: dist/ matches the source
        run: npm run check:dist
      - run: npm install -g firebase-tools
      - run: npm run test:emulator
